<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'">
  <title>SlimeBridge</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/loading.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/art.js" defer></script>
  <script src="js/scene.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/pages_home.js" defer></script>
  <script src="js/pages_tools.js" defer></script>
  <script src="js/pages_other.js" defer></script>
  <script src="js/pages_recovery.js" defer></script>
  <script src="js/loading.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="app">
    <header id="head"></header>
    <aside id="side"></aside>
    <main id="stage">
      <div id="view" tabindex="-1"></div>
      <footer id="dock"></footer>
    </main>
    <footer id="ribbon"></footer>
  </div>
  <div id="chars-back" aria-hidden="true"></div>
  <div id="chars" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="loading-root"></div>
</body>
</html>
